name: CI and deploy morimizu.dev

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      articles_sha:
        description: Published QiitaArticle commit SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: morimizu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Check out published articles
        uses: actions/checkout@v7
        with:
          repository: Morishita-mm/QiitaArticle
          ref: ${{ inputs.articles_sha || vars.QIITA_ARTICLES_REF || 'main' }}
          path: _qiita

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync public Qiita articles
        env:
          QIITA_ARTICLES_DIR: ${{ github.workspace }}/_qiita
        run: npm run sync:articles

      - name: Lint site source
        run: npm run lint

      - name: Build site with public Qiita articles
        # Shared editorial UI is exercised in both languages before release.
        env:
          QIITA_ARTICLES_DIR: ${{ github.workspace }}/_qiita
        run: npm run build

      - name: Verify bilingual editorial routes
        run: node dev-pages/workshop/verify-locale.mjs

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
