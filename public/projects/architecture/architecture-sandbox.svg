<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Sandbox — 3つの役割から見る論理構成</title>
  <desc id="desc">設計ワークスペースとアプリケーションがこのアプリを構成し、アプリケーションから外部のAIサービスへ接続する。ワークスペースは要件を整理して構成を描き、アプリケーションは対話と評価の進行を管理し、AIサービスは回答と設計評価を生成する。質問・設計を送り、回答・評価を受け取る関係を示す。</desc>
  <defs>
    <marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#526bd6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#8090a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 500; letter-spacing: 2px; }
      .title { font-size: 28px; font-weight: 600; letter-spacing: -0.7px; }
      .body { font-size: 20px; }
      .flow { font-size: 18px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1440" height="580" fill="#f7f9fc"/>
  <text x="64" y="52" class="eyebrow" fill="#677b97">LOGICAL ARCHITECTURE</text>
  <text x="64" y="110" font-size="42" font-weight="600" letter-spacing="-1.4" fill="#1b304b">Architecture Sandbox</text>
  <text x="64" y="151" font-size="22" fill="#637790">対話と設計を支える、3つの役割。</text>
  <path d="M64 184 H1376" stroke="#dce3ee"/>

  <!-- One application boundary; three logical components at the same level. -->
  <rect x="40" y="218" width="856" height="320" rx="20" fill="#edf2fa"/>
  <text x="64" y="252" font-size="16" fill="#637790">このアプリ</text>
  <text x="1072" y="252" font-size="16" fill="#637790">外部サービス</text>

  <rect x="64" y="280" width="304" height="228" rx="14" fill="#ffffff" stroke="#d6deeb"/>
  <text x="90" y="320" class="eyebrow" fill="#7183a0">WORKSPACE</text>
  <text x="90" y="366" class="title" fill="#1b304b">設計ワークスペース</text>
  <text x="90" y="422" class="body" fill="#637790">要件を整理し、</text>
  <text x="90" y="454" class="body" fill="#637790">構成を描く</text>

  <rect x="568" y="280" width="304" height="228" rx="14" fill="#1b304b"/>
  <text x="594" y="320" class="eyebrow" fill="#aab9d2">APPLICATION</text>
  <text x="594" y="366" class="title" fill="#ffffff">アプリケーション</text>
  <text x="594" y="422" class="body" fill="#d2dced">対話と評価の</text>
  <text x="594" y="454" class="body" fill="#d2dced">進行を管理する</text>

  <rect x="1072" y="280" width="304" height="228" rx="14" fill="#ffffff" stroke="#d6deeb"/>
  <text x="1098" y="320" class="eyebrow" fill="#7183a0">AI SERVICE</text>
  <text x="1098" y="366" class="title" fill="#1b304b">AIサービス</text>
  <text x="1098" y="422" class="body" fill="#637790">対話の回答と</text>
  <text x="1098" y="454" class="body" fill="#637790">設計への評価を生成する</text>

  <!-- Requests travel right; answers and evaluations return left. -->
  <path d="M368 360 H568" fill="none" stroke="#526bd6" stroke-width="2.2" marker-end="url(#request)"/>
  <text x="468" y="339" class="flow" fill="#526bd6">質問・設計</text>
  <path d="M872 360 H1072" fill="none" stroke="#526bd6" stroke-width="2.2" marker-end="url(#request)"/>
  <text x="972" y="339" class="flow" fill="#526bd6">対話・評価の依頼</text>
  <path d="M568 438 H368" fill="none" stroke="#8090a7" stroke-width="2" marker-end="url(#response)"/>
  <text x="468" y="470" class="flow" fill="#637790">回答・評価</text>
  <path d="M1072 438 H872" fill="none" stroke="#8090a7" stroke-width="2" marker-end="url(#response)"/>
  <text x="972" y="470" class="flow" fill="#637790">生成した回答・評価</text>
</svg>
