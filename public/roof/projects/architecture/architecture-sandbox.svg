<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Sandbox — ユーザー・アプリケーション・Geminiの論理構成</title>
  <desc id="desc">ユーザーがアプリケーション内でアーキテクチャ設計を行い、構成図と設計意図を設計評価へ渡す。アーキテクチャ設計はGeminiとの対話で要件を整理し、設計評価はGeminiから6軸の評価と改善案を受け取って表示する。ユーザーは評価結果を確認して設計を見直す。アーキテクチャ設計と設計評価は同じアプリケーション内の機能であり、別サービスではない。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2449ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#151519" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",sans-serif}
      .serif{font-family:Georgia,"Times New Roman",serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .ink{fill:#151519}.soft{fill:#67676f}.blue{fill:#2449ff}
      .rule{stroke:#151519;stroke-opacity:.18;stroke-width:1}
      .micro{font-size:13px;letter-spacing:.13em}
      .flowLabel{font-size:16px;text-anchor:middle}
      .flow{fill:none;stroke:#2449ff;stroke-width:2.4;stroke-linecap:round;marker-end:url(#arrow-blue)}
      .flowInk{fill:none;stroke:#151519;stroke-width:1.8;stroke-linecap:round;stroke-opacity:.72;marker-end:url(#arrow-ink)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <g fill="none" stroke="#2449ff" stroke-width="2" aria-hidden="true">
    <circle cx="1485" cy="105" r="112" stroke-opacity=".08"/>
    <circle cx="1485" cy="105" r="72" stroke-opacity=".08"/>
    <circle cx="1485" cy="105" r="31" stroke-opacity=".14"/>
  </g>
  <g class="mono micro soft">
    <text x="56" y="52">05 / SYSTEM ARCHITECTURE</text>
    <text x="1544" y="52" text-anchor="end">LOGICAL VIEW / DESIGN &amp; EVALUATION</text>
  </g>
  <line x1="56" y1="76" x2="1544" y2="76" class="rule"/>
  <text x="58" y="183" class="serif ink" font-size="92" font-weight="500">Architecture Sandbox</text>
  <text x="60" y="230" class="sans blue" font-size="25" font-weight="500">要件を聞き、構成を描き、設計を磨く。</text>

  <text x="56" y="302" class="mono micro blue">USER</text>
  <text x="478" y="302" class="mono micro blue">APPLICATION</text>
  <text x="1230" y="302" class="mono micro blue">EXTERNAL AI</text>

  <rect x="56" y="430" width="254" height="208" rx="8" fill="#ffffff" stroke="#151519" stroke-opacity=".28" stroke-width="1.5"/>
  <circle cx="87" cy="463" r="8" fill="#2449ff"/>
  <text x="111" y="471" class="sans ink" font-size="26" font-weight="500">ユーザー</text>
  <text x="84" y="518" class="sans soft" font-size="19">設計をつくり、</text>
  <text x="84" y="548" class="sans soft" font-size="19">見直す</text>

  <!-- One application boundary contains two functional components, not services. -->
  <rect x="478" y="328" width="638" height="368" rx="184" fill="#ffffff" stroke="#151519" stroke-opacity=".22" stroke-width="1.5"/>
  <rect x="514" y="392" width="566" height="278" rx="139" fill="#f0f2ff" stroke="#2449ff" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="797" y="377" text-anchor="middle" class="sans ink" font-size="28" font-weight="500">アプリケーション</text>

  <rect x="564" y="420" width="462" height="92" rx="46" fill="#ffffff" stroke="#2449ff" stroke-opacity=".35" stroke-width="1.3"/>
  <text x="795" y="456" text-anchor="middle" class="sans ink" font-size="26" font-weight="500">アーキテクチャ設計</text>
  <text x="795" y="487" text-anchor="middle" class="sans soft" font-size="18">要件を整理し、構成図を描く</text>
  <rect x="564" y="564" width="462" height="92" rx="46" fill="#ffffff" stroke="#2449ff" stroke-opacity=".35" stroke-width="1.3"/>
  <text x="795" y="600" text-anchor="middle" class="sans ink" font-size="26" font-weight="500">設計評価</text>
  <text x="795" y="631" text-anchor="middle" class="sans soft" font-size="18">6軸の評価と改善案を表示</text>

  <rect x="1230" y="426" width="314" height="224" rx="112" fill="#151519"/>
  <text x="1387" y="474" text-anchor="middle" class="mono micro" fill="#bac6ff">GOOGLE</text>
  <text x="1387" y="523" text-anchor="middle" class="sans" font-size="34" font-weight="500" fill="#ffffff">Gemini</text>
  <text x="1387" y="563" text-anchor="middle" class="sans" font-size="18" fill="#ffffff">対話の回答と</text>
  <text x="1387" y="592" text-anchor="middle" class="sans" font-size="18" fill="#ffffff">設計への評価を生成</text>

  <!-- The user creates the design and reviews the evaluation to refine it. -->
  <path d="M310 470C410 470 464 466 564 466" class="flow"/>
  <text x="410" y="446" class="sans blue flowLabel">質問・作図</text>
  <path d="M564 610C454 610 424 580 310 580" class="flowInk"/>
  <text x="410" y="631" class="sans soft flowLabel">評価を確認</text>

  <!-- Evaluation receives the user's diagram and rationale. -->
  <path d="M795 512V564" class="flow"/>
  <text x="815" y="544" class="sans blue" font-size="16">構成図・設計意図</text>

  <!-- Two-way exchanges with Gemini belong to the enclosing application. -->
  <path d="M1026 466H1256" class="flow" marker-start="url(#arrow-blue)"/>
  <text x="1173" y="441" class="sans blue flowLabel">要件の対話</text>
  <path d="M1026 610H1256" class="flow" marker-start="url(#arrow-blue)"/>
  <text x="1173" y="643" class="sans blue flowLabel">評価・改善案</text>

  <line x1="56" y1="762" x2="1544" y2="762" class="rule"/>
  <g class="mono micro soft">
    <text x="56" y="807">DESIGN INTENT</text>
    <text x="389" y="807">DESIGN FIRST</text>
    <text x="741" y="807">CLEAR RESPONSIBILITIES</text>
    <text x="1227" y="807">FEEDBACK LOOP</text>
  </g>
  <g fill="#2449ff" aria-hidden="true">
    <circle cx="369" cy="802" r="4"/>
    <circle cx="721" cy="802" r="4"/>
    <circle cx="1207" cy="802" r="4"/>
  </g>
</svg>
